name: weekly-technique-repo-radar

on:
  schedule:
    # GitHub Actions schedules use UTC. This is Monday 09:00 KST.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Per-query GitHub Search result limit'
        required: false
        default: '10'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-technique-repo-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate weekly radar artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          python3 scripts/weekly_repo_radar.py --date "$(date -u +%F)" --limit "$LIMIT"

      - name: Detect radar changes
        id: changes
        run: |
          if git diff --quiet -- repos/radar; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_DATE="$(date -u +%F)"
          BRANCH="automation/weekly-technique-repo-radar-${RUN_DATE}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add repos/radar
          git commit -m "Track weekly agent engineering technique repository radar

Constraint: External repositories are metadata-only; no vendoring.
Confidence: medium
Scope-risk: narrow
Directive: Review GitHub technique repo candidates before promoting anything into repos/registry.yaml or techniques/registry.yaml.
Tested: python3 scripts/weekly_repo_radar.py generated radar artifacts in CI.
Not-tested: Human qualitative review of candidate repositories."
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Weekly agent technique repo radar ${RUN_DATE}" \
            --body "Generated GitHub-first technique repository radar artifacts under repos/radar/. Review candidates manually before adopting any repository or technique." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH"
