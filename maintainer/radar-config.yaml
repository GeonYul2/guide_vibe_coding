version: 0.4.0
purpose: >
  Manual GitHub-first discovery of hot agent-engineering technique repositories for maintainers.
  Video/article sources are supplemental and are handled by workflows/source-ingestion.md.
suggested_cadence: weekly_when_maintainer_requests
automatic_triggers: disabled
manual_trigger: workflow_dispatch_or_local_script
search:
  per_query_limit: 10
  dynamic_search:
    enabled: true
    max_dynamic_queries: 80
    min_star_delta_for_rising: 10
    strategy: >
      Combine curated static searches with generated freshness/growth searches across
      topic x created/pushed windows. This approximates a rising-repository radar
      from GitHub API signals without relying on third-party trending sites.
  dynamic_topics:
    - "ai agent"
    - "agent harness"
    - "agent eval"
    - "llm eval"
    - "structured outputs llm"
    - "llm observability"
    - "agent telemetry"
    - "context engineering"
    - "prompt caching"
    - "token optimization"
    - "mcp server"
    - "mcp tools"
    - "agent memory"
    - "rag agent"
    - "model routing llm"
    - "llm guardrails"
    - "claude code"
    - "codex cli"
    - "agent workflow"
    - "agentic engineering"
  queries:
    - "agent harness stars:>50 pushed:>={year_start}"
    - "agent eval framework stars:>100 pushed:>={year_start}"
    - "structured outputs llm schema validation stars:>50 pushed:>={year_start}"
    - "llm guardrails tripwires agent stars:>50 pushed:>={year_start}"
    - "llm observability agents telemetry stars:>100 pushed:>={year_start}"
    - "context engineering llm stars:>100 pushed:>={year_start}"
    - "prompt caching token optimization llm agent stars:>50 pushed:>={year_start}"
    - "llm cost optimization token budget agent stars:>50 pushed:>={year_start}"
    - "prompt engineering workflow agent stars:>50 pushed:>={year_start}"
    - "agentic engineering workflow stars:>50 pushed:>={year_start}"
    - "mcp tools agent stars:>100 pushed:>={year_start}"
    - "ai agent memory rag governance stars:>50 pushed:>={year_start}"
    - "llm model routing fallback agent stars:>50 pushed:>={year_start}"
    - "ai agent security privacy guardrails stars:>50 pushed:>={year_start}"
    - "ai agent canary rollout monitoring stars:>20 pushed:>={year_start}"
    - "claude code agents workflow stars:>100 pushed:>={year_start}"
filters:
  min_technique_score: 3
  required_any_keywords:
    - agent
    - agents
    - agentic
    - llm
    - harness
    - eval
    - evaluation
    - benchmark
    - observability
    - trace
    - tracing
    - telemetry
    - schema
    - schemas
    - structured output
    - structured outputs
    - validation
    - prompt
    - workflow
    - context
    - token
    - tokens
    - cost
    - budget
    - optimization
    - cache
    - caching
    - memory
    - rag
    - retrieval
    - vector
    - mcp
    - tool
    - tools
    - framework
    - sdk
    - orchestration
    - playbook
    - patterns
    - guide
    - testing
    - guardrails
    - sandbox
    - permission
    - privacy
    - security
    - pii
    - routing
    - fallback
    - canary
    - rollout
    - deployment
  exclude_keywords:
    - flight
    - flights
    - airline
    - booking
    - travel
    - crypto trading
    - dating
    - game bot
scoring:
  factors:
    - stars
    - star_delta_from_previous_radar
    - stars_per_repo_age_day
    - recent_creation
    - recent_push
    - technique_keyword_score
    - matched_query_count
    - dynamic_query_hit_count
    - fork_count
review_policy:
  auto_vendor_repos: false
  auto_modify_main_registry: false
  output_only:
    - maintainer/radar/YYYY-MM-DD.md
    - maintainer/radar/YYYY-MM-DD-candidates.yaml
  human_review_required_for:
    - moving candidate into repos/registry.yaml
    - marking a source as adopted
    - adding a new mandatory technique
